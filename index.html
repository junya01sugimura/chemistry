// --- アプリ制御ロジック ---
let currentChapter = 0;
let currentQuestionIndex = 0;
let score = 0;
let isAnswered = false;

function startQuiz(chapterId) {
    currentChapter = chapterId;
    currentQuestionIndex = 0;
    score = 0;
    document.getElementById('setup-screen').classList.remove('active');
    document.getElementById('quiz-screen').classList.add('active');
    showQuestion();
}

function showQuestion() {
    isAnswered = false;
    const questionData = quizData[currentChapter][currentQuestionIndex];
    document.getElementById('progress').innerText = `第 ${currentChapter} 章 ： 問題 ${currentQuestionIndex + 1} / 10`;
    document.getElementById('question-text').innerText = questionData.question;
    
    // 画像制御
    const imageEl = document.getElementById('question-image');
    if (questionData.image) {
        imageEl.src = questionData.image;
        imageEl.style.display = 'block';
    } else {
        imageEl.style.display = 'none';
    }

    // 数式表示更新
    if (window.MathJax) {
        MathJax.typesetPromise();
    }

    // 選択肢ボタン描画
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    questionData.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.innerText = option;
        button.onclick = () => checkAnswer(index + 1, button);
        optionsContainer.appendChild(button);
    });

    document.getElementById('explanation').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
}

function checkAnswer(selectedOption, clickedButton) {
    if (isAnswered) return;
    isAnswered = true;
    const questionData = quizData[currentChapter][currentQuestionIndex];
    const correctOption = questionData.answer;

    if (selectedOption === correctOption) {
        clickedButton.classList.add('correct');
        score++;
    } else {
        clickedButton.classList.add('wrong');
        const buttons = document.querySelectorAll('.option-btn');
        buttons[correctOption - 1].classList.add('correct');
    }

    document.getElementById('explanation').innerHTML = `<strong>【解説】</strong><br>${questionData.explanation}`;
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('next-btn').style.display = 'block';

    if (window.MathJax) {
        MathJax.typesetPromise();
    }

    if (currentQuestionIndex === quizData[currentChapter].length - 1) {
        document.getElementById('next-btn').innerText = '結果を見る';
    } else {
        document.getElementById('next-btn').innerText = '次の問題へ';
    }
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData[currentChapter].length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').classList.remove('active');
    document.getElementById('result-screen').classList.add('active');
    document.getElementById('score-text').innerText = `第 ${currentChapter} 章：10問中 ${score} 問正解！`;
}

function backToSetup() {
    document.getElementById('result-screen').classList.remove('active');
    document.getElementById('setup-screen').classList.add('active');
}
</script>
